<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernweh | Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/quiz.css">
    <link rel="icon" href="../assets/imgs/logo.gif">
    <script src="../js/sessao.js"></script>
</head>

<body onload="iniciar()">

    <nav class="sidebar close">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="../assets/imgs/sidebar.png" alt="">
                </span>

                <div class="text header-text">
                    <span class="name" id="nomeUsuario">Viajante</span>
                    <span class="profession">Lindo de Bonito</span>
                </div>
            </div>

            <i class='bx bx-chevron-right toggle'></i>
        </header>

        <div class="menu-bar">
            <div class="menu">
                <li class="search-box">
                    <i class='bx bx-search icon'></i>
                    <input type="search" placeholder="Search...">
                </li>
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="../quiz/quiz.html">
                            <i class='bx bx-home-alt icon'></i>
                            <span class="text nav-text">Quiz</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="../dashboard/dashboard.html">
                            <i class='bx bx-bar-chart-alt-2 icon'></i>
                            <span class="text nav-text">Dash</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class='bx bx-map-alt icon'></i>
                            <span class="text nav-text">Maps</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div class="bottom-content">
                <li class="">
                    <a href="../index.html" id="btnSair">
                        <i class='bx bx-log-out icon'></i>
                        <span class="text nav-text">Logout</span>
                    </a>
                </li>

                <li class="mode">
                    <div class="moon-sun">
                        <i class='bx bx-moon icon moon'></i>
                        <i class='bx bx-sun icon sun'></i>
                    </div>
                    <span class="mode-text text">Dark Mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>

                </li>
            </div>
        </div>
    </nav>

    <div class="polaroid sem-moldura polaroid-esquerda">
        <img src="../assets/imgs/Foto — férias na praia.png" alt="Dois cachorros na praia">
    </div>

    <div class="polaroid sem-moldura polaroid-direita">
        <img src="../assets/imgs/Polaroid — sapo.png" alt="Sapo lendo um livro">
    </div>

    <div class="pagina">

        <header class="topo">
            <span class="logo">Fernweh</span>
            <a class="topo-info" href="index.html">Início do quiz</a>
        </header>

        <div class="trilha">
            <div class="trilha-preenchida" id="barra"></div>
            <img class="pin" id="pin" src="../assets/imgs/Marcador de destino.png" alt="">
        </div>
        <p class="contagem" id="contagem"></p>

        <main class="card card-quiz">
            <h1 id="titulo"></h1>
            <p class="dica" id="dica"></p>

            <div id="area"></div>
            <p class="erro" id="erro"></p>

            <div class="rodape-quiz">
                <button class="voltar" onclick="voltar()">Voltar</button>
                <button class="botao botao-laranja botao-proxima" id="btn_proxima" onclick="proxima()"></button>
            </div>
        </main>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="quiz.js"></script>
</body>

</html>
